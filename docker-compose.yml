version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hris
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hris?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: super-secret-access
      JWT_REFRESH_SECRET: super-secret-refresh
      FRONTEND_URL: http://localhost:5173
      PORT: 4000
    depends_on:
      - postgres
      - redis
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - backend
    ports:
      - '5173:5173'

volumes:
  pgdata:
